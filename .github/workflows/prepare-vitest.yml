name: Preparar actualización de Vitest
on:
  pull_request:
    branches: [security/astro-dependency-update]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --save-dev vitest@5.0.5
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-lock-candidate
          path: |
            package.json
            package-lock.json
          retention-days: 1
