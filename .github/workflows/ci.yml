name: Pruebas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Construir sitio
        run: npm run build
        env:
          # Dominio propio: el sitio se sirve desde la raíz de https://calculapanama.com/
          SITE_URL: https://calculapanama.com/
          BASE_PATH: /
