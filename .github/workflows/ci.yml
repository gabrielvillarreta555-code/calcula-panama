name: Pruebas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Construir sitio
        run: npm run build
        env:
          # Dominio propio: el sitio se sirve desde la raíz de https://calculapanama.com/
          SITE_URL: https://calculapanama.com/
          BASE_PATH: /
      - name: Verificar sitemap, robots.txt y URL canónicas
        run: npm run verify:seo
        env:
          SITE_URL: https://calculapanama.com/
      - name: Comprobar, construir y verificar la app sin publicidad (app.calculapanama.com)
        run: npm run check:app && npm run build:app && npm run verify:app

  browsers:
    name: Navegadores (Firefox y Safari)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Firefox y WebKit para Playwright
        run: npx playwright install --with-deps firefox webkit
      - name: Construir sitio
        run: npm run build
        env:
          SITE_URL: https://calculapanama.com/
          BASE_PATH: /
      - name: Probar Salario neto, Mi Quincena y Modo Pasillo en Firefox, WebKit y WebKit iPhone
        run: npx playwright test --config playwright.browsers.config.ts --trace off --reporter=list

  mobile:
    name: Interfaz móvil
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Construir sitio
        run: npm run build
        env:
          SITE_URL: https://calculapanama.com/
          BASE_PATH: /
      - name: Probar calculadoras y Blue en viewports móviles
        run: npm run test:e2e
      - name: Probar el aislamiento de Mi Quincena y la guardia de publicidad
        run: npm run test:isolation -- --trace off
      - name: Guardar captura móvil de Modo Pasillo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modo-pasillo-captura
          path: test-results/screenshots/modo-pasillo-375.png
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas de Mi Quincena (datos de ejemplo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-quincena-capturas
          path: test-results/mi-quincena/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas de compartir (datos de ejemplo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compartir-capturas
          path: test-results/compartir/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas de la calculadora de préstamos (datos de ejemplo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prestamos-capturas
          path: test-results/prestamos/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar captura de Blue Interactivo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-interactivo-mobile
          path: test-results/blue-interactivo/mobile.png
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas de las cinco herramientas y el directorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expansion-3-capturas
          path: test-results/expansion-3/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar captura del financiamiento de autos (datos de ejemplo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automoviles-capturas
          path: test-results/automoviles/*.png
          if-no-files-found: warn
          retention-days: 14
