name: Auditoría de dependencias de integración
on:
  pull_request:
    branches: [main, integration/candidato-lanzamiento]
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit
      - name: Clasificar avisos de npm
        shell: bash
        run: |
          set -o pipefail
          npm audit --json | node scripts/audit-summary.mjs
