name: Preparar actualización de Astro
on:
  pull_request:
    branches: [integration/candidato-lanzamiento]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit astro@7.4.4
      - uses: actions/upload-artifact@v4
        with:
          name: astro-lock-candidate
          path: |
            package.json
            package-lock.json
          retention-days: 1
